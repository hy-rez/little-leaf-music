<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="description" content="小叶子的音乐盒，收集一家三口的快乐节拍。"><title>小叶子的音乐盒</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#1f201d;background:#fff;font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;font-size:16px;line-height:1.6}main{max-width:1100px;margin:auto;padding:48px 28px}header{display:flex;align-items:center;gap:16px;margin-bottom:32px}.leaf{width:44px;height:44px;color:#1b6e66;flex:none}h1{font-size:28px;font-weight:500;margin:0}p{margin:6px 0;color:#636361}.intro{background:#f1f5f2;border-radius:22px;padding:26px 30px;display:flex;justify-content:space-between;gap:20px;align-items:center}.intro strong{font-size:22px;font-weight:500}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select{font:inherit;border:1px solid #d9d9d6;border-radius:24px;padding:10px 18px;min-height:44px;background:white;color:inherit}button{cursor:pointer}button:hover{background:#e8efea}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #1b6e66;outline-offset:3px}#playAll{background:#1f201d;color:white;border-color:#1f201d}.listhead{display:flex;justify-content:space-between;align-items:baseline;margin-top:32px}h2{font-size:18px;font-weight:500;margin:0}#count{color:#636361;font-size:14px}article{display:grid;grid-template-columns:42px 1fr minmax(250px,380px) 64px;gap:16px;align-items:center;padding:24px 0;border-bottom:1px solid #eaeaea}.number{color:#636361;font-variant-numeric:tabular-nums}.title{font-size:18px;font-weight:500}.desc{font-size:14px;color:#636361}audio{width:100%;height:44px}a{color:#1b6e66;text-underline-offset:4px;padding:10px 0}.playing .number,.playing .title{color:#1b6e66}footer{margin-top:30px;color:#636361;font-size:14px}#status{min-height:26px;font-size:14px;margin:12px 0 0}.error{color:#9b2525}@media(max-width:650px){main{padding:28px 20px}h1{font-size:24px}header{margin-bottom:24px}.intro{padding:22px;display:block}.intro strong{font-size:19px}.controls{margin-top:18px}article{grid-template-columns:24px 1fr 48px;gap:10px;padding:20px 0}audio{grid-column:2/4;grid-row:2}.download{grid-column:3;grid-row:1}.title{font-size:17px}.listhead{margin-top:24px}}
.title{display:block;text-align:left;border:0;background:transparent;border-radius:4px;padding:0;min-height:44px;line-height:1.5}.title:hover{background:transparent;text-decoration:underline}.lyric-panel{grid-column:1/-1;background:#f1f5f2;border-radius:16px;padding:22px;text-align:center}.lyric-panel[hidden]{display:none}.lyric-panel p{font-size:14px}.lyric-scroll{white-space:pre-wrap;line-height:2.2;max-height:360px;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;margin-top:16px}.lyric-scroll:focus-visible{outline:2px solid #1b6e66}.share{margin-top:18px;font-size:14px}#shareHint{font-size:14px} @media(max-width:650px){.lyric-scroll{max-height:42vh;font-size:17px}.lyric-panel{padding:18px 12px}}
</style></head><body><main><header><svg class="leaf" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M39 8C17 5 5 17 12 31c14 7 27-3 27-23Z" stroke="currentColor" stroke-width="2.3"/><path d="M9 40 31 18m-11 11v-9m0 9h10" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg><div><h1>小叶子的音乐盒</h1><p>把长大的每一步，唱给你听。</p></div></header>
<section class="intro" aria-label="播放设置"><div><strong>小叶子，今天也一起摇摆吧。</strong><p>爸爸、妈妈和你，我们的小小世界。</p></div><div class="controls"><button id="playAll" disabled>从头播放</button><select id="mode" aria-label="播放模式"><option value="sequence">顺序播放</option><option value="single">单曲循环</option><option value="all">列表循环</option></select></div></section>
<p id="status" role="status" aria-live="polite">正在加载歌曲…</p><div class="listhead"><h2>我们的歌</h2><span id="count"></span></div><section id="tracks" aria-label="歌曲列表"></section><footer><button id="share" class="share">复制分享链接</button><p id="shareHint" role="status"></p>小小的日子，慢慢收藏。<br>点一下播放，让快乐继续。</footer></main><script>
const list=document.querySelector('#tracks'),status=document.querySelector('#status'),mode=document.querySelector('#mode');let players=[];
async function play(i){try{await players[i].play()}catch(e){status.textContent='暂时无法播放，请点歌曲旁的播放键重试。'}}
fetch('tracks.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(tracks=>{document.querySelector('#count').textContent=tracks.length+' 首歌曲';tracks.forEach((t,i)=>{const row=document.createElement('article');row.id=t.id;const n=document.createElement('span');n.className='number';n.textContent=String(i+1).padStart(2,'0');const info=document.createElement('div');const title=document.createElement('button');title.className='title';title.textContent=t.title;title.setAttribute('aria-label','播放'+t.title+' '+t.description);title.onclick=()=>play(i);const desc=document.createElement('div');desc.className='desc';desc.textContent=t.description;info.append(title,desc);const a=document.createElement('audio');a.controls=true;a.preload='metadata';a.src=t.src;a.setAttribute('aria-label',t.title+' '+t.description);const link=document.createElement('a');link.className='download';link.href=t.src;link.download=t.title+'_'+t.description+'.mp3';link.textContent='下载';link.setAttribute('aria-label','下载'+t.title+' '+t.description);const panel=document.createElement('section');panel.className='lyric-panel';panel.hidden=true;panel.setAttribute('aria-label',t.title+'歌词');const lh=document.createElement('h2');lh.textContent='歌词';const note=document.createElement('p');note.textContent='上下滑动查看 · 创作原稿';const lyrics=document.createElement('div');lyrics.className='lyric-scroll';lyrics.tabIndex=0;lyrics.textContent=t.lyrics||'歌词待补充';panel.append(lh,note,lyrics);row.append(n,info,a,link,panel);list.append(row);players.push(a);a.addEventListener('play',()=>{players.forEach(p=>{if(p!==a)p.pause()});document.querySelectorAll('.lyric-panel').forEach(p=>p.hidden=p!==panel);panel.hidden=false;row.classList.add('playing');status.textContent='正在播放：'+t.title+' · '+t.description});a.addEventListener('pause',()=>{row.classList.remove('playing');if(players.every(p=>p.paused))status.textContent='播放已暂停';});a.addEventListener('ended',()=>{row.classList.remove('playing');if(mode.value==='single'){a.currentTime=0;play(i)}else if(i+1<players.length)play(i+1);else if(mode.value==='all')play(0);else status.textContent='已经播放完全部歌曲。';});a.addEventListener('error',()=>{status.textContent='歌曲加载失败，请检查网络或尝试下载播放。'});});status.textContent='点击歌名，边听边看歌词。';document.querySelector('#playAll').disabled=false;}).catch(()=>{status.textContent='歌曲列表加载失败，请刷新页面重试。';status.classList.add('error')});document.querySelector('#playAll').onclick=()=>{if(players.length){players[0].currentTime=0;play(0)}};
document.querySelector('#share').onclick=async()=>{const hint=document.querySelector('#shareHint');try{await navigator.clipboard.writeText(location.href.split('#')[0]);hint.textContent='链接已复制，粘贴到微信即可分享。'}catch(e){hint.textContent='请用微信右上角菜单分享，或复制浏览器地址。'}};</script></body></html>
